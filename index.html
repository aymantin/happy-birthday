<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a Wish</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: #02030a;
      overflow: hidden;
      color: #e9dcc0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ---------- code gate ---------- */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #0c1c60 0%, #02030a 75%);
      transition: opacity 1.2s ease;
    }

    #gate.out {
      opacity: 0;
      pointer-events: none;
    }

    #gate h2 {
      font-family: 'Cinzel', Georgia, serif;
      letter-spacing: .3em;
      font-size: clamp(18px, 4vw, 28px);
      color: #d9b865;
      font-weight: 500;
    }

    #gate p {
      font-style: italic;
      opacity: .7;
      font-size: 18px;
    }

    #code {
      width: min(280px, 70vw);
      padding: 12px 16px;
      text-align: center;
      font-size: 24px;
      letter-spacing: .35em;
      background: rgba(255, 255, 255, .05);
      border: 1px solid #8c7a4a;
      border-radius: 6px;
      color: #f3e6c4;
      outline: none;
      font-family: 'Cinzel', Georgia, serif;
    }

    #code:focus {
      border-color: #e8c872;
      box-shadow: 0 0 18px rgba(232, 200, 114, .35);
    }

    #go {
      padding: 10px 34px;
      background: transparent;
      border: 1px solid #d9b865;
      color: #d9b865;
      letter-spacing: .25em;
      font-family: 'Cinzel', Georgia, serif;
      cursor: pointer;
      border-radius: 4px;
      transition: .25s;
    }

    #go:hover {
      background: #d9b865;
      color: #02030a;
    }

    #err {
      height: 20px;
      color: #e58a8a;
      font-size: 17px;
      opacity: 0;
      transition: opacity .3s;
    }

    .shake {
      animation: shake .4s;
    }

    @keyframes shake {

      20%,
      60% {
        transform: translateX(-10px);
      }

      40%,
      80% {
        transform: translateX(10px);
      }
    }

    /* ---------- text overlay ---------- */
    #msg {
      position: fixed;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0 20px;
      z-index: 5;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }

    #msg.title {
      top: 42%;
    }

    #msg.top {
      top: 14%;
      font-size: clamp(20px, 3.4vw, 30px);
      font-style: italic;
      line-height: 1.5;
    }

    #msg.low {
      top: 78%;
      font-size: clamp(18px, 2.8vw, 24px);
      font-style: italic;
      opacity: 0;
      color: #cfc6b0;
    }

    #msg.big {
      top: 37%;
    }

    #msg.fin {
      bottom: 6%;
    }

    .gold {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 700;
      letter-spacing: .14em;
      line-height: 1.15;
      font-size: clamp(34px, 7vw, 64px);
      background: linear-gradient(180deg, #fff3c4 0%, #e5bb62 50%, #a87a2c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .7));
    }

    .sub {
      font-style: italic;
      font-size: clamp(18px, 2.6vw, 24px);
      margin-top: 14px;
      opacity: .85;
    }

    #bar {
      position: fixed;
      left: 50%;
      top: 84%;
      width: 160px;
      height: 2px;
      margin-left: -80px;
      background: rgba(255, 255, 255, .15);
      z-index: 5;
      opacity: 0;
      transition: opacity .4s;
    }

    #bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #b8862e, #ffe6a0);
      box-shadow: 0 0 10px #ffd27a;
    }
  </style>
</head>

<body>

  <div id="gate">
    <h2>ENTER THE CODE</h2>
    <p>A little surprise is waiting for you</p>
    <input id="code" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="········">
    <button id="go">UNLOCK</button>
    <div id="err">That's not the right code. Try again.</div>
  </div>

  <canvas id="c"></canvas>
  <div id="msg"></div>
  <div id="bar"><i></i></div>

  <script>
    /* =========================================================
       CONFIG — change the secret code here
       ========================================================= */
    const SECRET = '28112010';

    /* ---------- gate ---------- */
    const gate = document.getElementById('gate'), codeEl = document.getElementById('code'), errEl = document.getElementById('err');
    let unlocked = false;
    function tryCode() {
      if (codeEl.value.trim() === SECRET) {
        unlocked = true; gate.classList.add('out'); codeEl.blur();
        setTimeout(() => go('title'), 600);
      } else {
        errEl.style.opacity = 1; codeEl.classList.remove('shake'); void codeEl.offsetWidth; codeEl.classList.add('shake');
        codeEl.value = ''; setTimeout(() => errEl.style.opacity = 0, 2000);
      }
    }
    document.getElementById('go').onclick = tryCode;
    codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });
    codeEl.focus();

    /* ---------- canvas setup ---------- */
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    let W, H, DPR;
    function resize() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    addEventListener('resize', resize); resize();

    const msg = document.getElementById('msg'), bar = document.getElementById('bar'), barI = bar.querySelector('i');
    let msgTimer;
    function say(html, cls, delay = 0) {
      clearTimeout(msgTimer);
      msg.style.opacity = 0;
      msgTimer = setTimeout(() => { msg.className = cls; msg.innerHTML = html; msg.style.opacity = 1; }, delay || 50);
    }
    const hide = () => { msg.style.opacity = 0; };

    /* ---------- state machine ---------- */
    let stage = 'gate', t = 0, said = {};
    let cakeRise = 0, dim = 0, flash = 0, wish = 0, holding = false, lit = 0, bgMix = 0;
    function go(s) { stage = s; t = 0; said = {}; }
    function once(k, fn) { if (!said[k]) { said[k] = 1; fn(); } }

    function press() {            // ENTER / tap
      if (stage === 'title') go('rise');
    }
    function holdStart() { holding = true; }
    function holdEnd() { holding = false; }
    addEventListener('keydown', e => {
      if (!unlocked) return;
      if (e.key === 'Enter') press();
      if (e.code === 'Space') { e.preventDefault(); holdStart(); }
      if (e.key.toLowerCase() === 'r' && stage === 'finale') reset();
    });
    addEventListener('keyup', e => { if (e.code === 'Space') holdEnd(); });
    cv.addEventListener('pointerdown', () => {
      if (!unlocked) return;
      if (stage === 'title') press(); else if (stage === 'finale' && t > 4) reset(); else holdStart();
    });
    addEventListener('pointerup', holdEnd);

    function reset() {
      cakeRise = dim = flash = wish = lit = bgMix = 0; confetti.length = 0; sparks.length = 0; fw.length = 0;
      hide(); go('title');
    }

    /* ---------- particles ---------- */
    const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + .3, p: Math.random() * 6 }));
    const confetti = [], sparks = [], fw = [];
    const CONF = ['#f6dc8a', '#ffffff', '#d9b865', '#cfd8ff', '#e8e2d0', '#7f93d8'];

    function addConfetti(n) {
      for (let i = 0; i < n; i++) confetti.push({
        x: Math.random() * W, y: -20 - Math.random() * 60, vy: 60 + Math.random() * 120, sw: Math.random() * 6, sp: 1 + Math.random() * 2,
        w: 4 + Math.random() * 5, h: 7 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - .5) * 8,
        c: CONF[Math.floor(Math.random() * CONF.length)]
      });
    }
    function launchFirework() {
      const x = W * (.12 + Math.random() * .76), y = H * (.1 + Math.random() * .3);
      const col = ['#ffe6a0', '#ffffff', '#9fb4ff', '#ffc27a'][Math.floor(Math.random() * 4)];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * 6.283, v = 40 + Math.random() * 130;
        fw.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.2 + Math.random() * .6, age: 0, c: col });
      }
    }

    /* ---------- drawing helpers ---------- */
    function ell(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.283); ctx.fillStyle = fill; ctx.fill(); }

    function tier(x, y, rx, h, topCol, sideA, sideB) {
      const ry = rx * .22;
      const g = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
      g.addColorStop(0, sideA); g.addColorStop(.35, sideB); g.addColorStop(1, sideA);
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(x - rx, y - h); ctx.lineTo(x - rx, y); ctx.ellipse(x, y, rx, ry, 0, Math.PI, 0, true);
      ctx.lineTo(x + rx, y - h); ctx.fill();
      ell(x, y - h, rx, ry, topCol);
    }

    function cakeGeom() {
      const s = Math.min(W / 400, H / 700), x = W / 2;
      const y = H * .60 + (1 - cakeRise) * (H * .5);
      return { s, x, y };
    }

    function drawCake(g) {
      const { s, x, y } = g;
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ell(0, 22, 165, 22, 'rgba(0,0,0,.45)');                                   // shadow
      tier(0, 8, 150, 8, '#e6c473', '#8a6420', '#e7c06a');                      // gold plate
      ell(0, 0, 138, 28, '#f2d58c');
      ell(0, 0, 124, 24, '#c9a24f');
      tier(0, -2, 105, 52, '#ffffff', '#a9aebd', '#f4f4f8');                    // bottom tier
      ctx.fillStyle = '#16245e'; ctx.beginPath();                               // ribbon
      ctx.moveTo(-105, -18); ctx.lineTo(-105, -4); ctx.ellipse(0, -4, 105, 23, 0, Math.PI, 0, true);
      ctx.lineTo(105, -18); ctx.ellipse(0, -18, 105, 23, 0, 0, Math.PI, false); ctx.fill();
      for (let i = -9; i <= 9; i++) ell(i * 11, -18 + Math.sqrt(Math.max(0, 1 - (i * 11 / 105) ** 2)) * 23, 2, 2, '#d9b865');
      tier(0, -54, 72, 44, '#ffffff', '#a9aebd', '#f4f4f8');                    // top tier
      for (let i = -6; i <= 6; i++) {                                           // frosting dots
        const px = i * 11; ell(px, -54 + Math.sqrt(Math.max(0, 1 - (px / 72) ** 2)) * 15.8, 3.5, 3.5, '#fff');
      }
      const cx = [-38, -19, 0, 19, 38];                                         // candles
      cx.forEach((c, i) => {
        const cy = -98 + Math.abs(c) * .05 - (i % 2) * 3;
        ctx.fillStyle = i % 2 ? '#1c2b6e' : '#f1e6c9'; ctx.fillRect(c - 3.5, cy - 34, 7, 34);
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(c - 3.5, cy - 34, 2, 34);
      });
      ctx.restore();
    }

    function flames(g, power) {   // power 0..~2.2 ; per-candle lighting uses `lit`
      const { s, x, y } = g, cx = [-38, -19, 0, 19, 38];
      cx.forEach((c, i) => {
        const k = Math.max(0, Math.min(1, lit - i)); if (!k) return;
        const fx = x + c * s, fy = y + (-98 + Math.abs(c) * .05 - (i % 2) * 3 - 38) * s;
        const fl = 1 + Math.sin(performance.now() / 90 + i * 2) * .08, sc = k * power * fl * s;
        const gl = ctx.createRadialGradient(fx, fy, 0, fx, fy, 70 * sc);
        gl.addColorStop(0, 'rgba(255,200,110,.55)'); gl.addColorStop(1, 'rgba(255,160,60,0)');
        ctx.fillStyle = gl; ctx.fillRect(fx - 80 * sc, fy - 80 * sc, 160 * sc, 160 * sc);
        ctx.beginPath(); ctx.moveTo(fx, fy - 20 * sc);
        ctx.quadraticCurveTo(fx + 8 * sc, fy - 4 * sc, fx, fy + 5 * sc);
        ctx.quadraticCurveTo(fx - 8 * sc, fy - 4 * sc, fx, fy - 20 * sc);
        const fg = ctx.createLinearGradient(0, fy - 20 * sc, 0, fy + 5 * sc);
        fg.addColorStop(0, '#fff2b0'); fg.addColorStop(.6, '#ffb23c'); fg.addColorStop(1, '#ff7a1c');
        ctx.fillStyle = fg; ctx.fill();
      });
    }

    function background(dt) {
      const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .75);
      const a = 1 - dim * .85, mix = bgMix;
      g.addColorStop(0, `rgba(${12 + mix * 40},${28 + mix * 10},${Math.round(95 * a + mix * 50)},1)`);
      g.addColorStop(.6, `rgba(3,${6 + mix * 4},${Math.round(30 * a + mix * 25)},1)`);
      g.addColorStop(1, '#02030a');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const now = performance.now() / 1000;
      stars.forEach(st => {
        ctx.globalAlpha = (.35 + .5 * Math.sin(now * 1.5 + st.p)) * (1 - dim * .5);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r, 0, 6.283); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function spotlight() {
      const a = Math.min(1, t / 1.5), top = W / 2;
      const g = ctx.createLinearGradient(0, 0, 0, H * .62);
      g.addColorStop(0, `rgba(235,225,255,${.28 * a})`); g.addColorStop(1, `rgba(200,190,255,${.08 * a})`);
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(top - 22, 0); ctx.lineTo(top + 22, 0); ctx.lineTo(top + W * .3, H * .62); ctx.lineTo(top - W * .3, H * .62); ctx.fill();
    }

    /* ---------- main loop ---------- */
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
      background(dt);
      const g = cakeGeom();

      /* stage logic */
      if (stage === 'title') {
        once('t', () => say('<div class="gold">MAKE A WISH</div><div class="sub">an interactive birthday surprise</div><div class="sub" style="margin-top:36px;font-size:18px;opacity:.6">Press ENTER to begin</div>', 'title'));
      }
      if (stage === 'rise') {
        cakeRise = Math.min(1, t / 2.6); cakeRise = 1 - Math.pow(1 - cakeRise, 3);
        once('h', hide);
        if (t > 2.2) once('s', () => say('Someone special is celebrating today...', 'top'));
        if (t > 5) go('candles');
      }
      if (stage === 'candles') {
        cakeRise = 1; lit = Math.min(5, Math.max(0, (t - .4) / .45));
        if (t > 4.5) go('dim');
      }
      if (stage === 'dim') {
        lit = 5; dim = Math.min(1, t / 1.8);
        once('b', () => say('Before we celebrate...<br>Close your eyes and make a wish.', 'top'));
        if (t > 5) go('hold');
      }
      if (stage === 'hold') {
        once('p', () => say('Press and hold SPACE to make your wish.', 'low', 200));
        if (holding) { wish += dt / 2.8; once('k', () => say('Keep holding...', 'low')); bar.style.opacity = 1; }
        else { wish = Math.max(0, wish - dt * .6); if (wish === 0 && said.k) { said.k = 0; said.p = 0; bar.style.opacity = 0; } }
        barI.style.width = (wish * 100) + '%';
        if (wish >= 1) { bar.style.opacity = 0; hide(); go('flash'); }
      }
      if (stage === 'flash') {
        flash = t < .5 ? t / .5 : Math.max(0, 1 - (t - .5) / 1.6);
        dim = Math.max(.2, dim - dt * .6);
        if (t > .8) once('w', () => say('<div class="gold">WISH MADE.</div><div class="sub">Now let the beautiful things begin.</div>', 'big'));
        if (t > 4.2) { hide(); go('finale'); }
      }
      if (stage === 'finale') {
        dim = Math.max(0, dim - dt * .8); bgMix = Math.min(1, bgMix + dt * .6); lit = Math.max(0, lit - dt * 3);
        if (t > .3) once('f', () => { say('<div class="gold">HAPPY<br>BIRTHDAY!</div>', 'fin'); });
        if (t > 2) once('g', () => { msg.innerHTML += '<div class="sub">May every little wish find its way to you.</div>'; });
        if (t > 4.5) once('r', () => { msg.innerHTML += '<div class="sub" style="font-size:16px;opacity:.5;margin-top:8px">Press R to replay</div>'; });
        spotlight();
        if (Math.random() < dt * 90) addConfetti(1);
        if (Math.random() < dt * .9) launchFirework();
      }
      if (stage === 'flash' && t < .3) for (let i = 0; i < 6; i++) sparks.push({ x: g.x + (Math.random() - .5) * 90 * g.s, y: g.y - 135 * g.s, vx: (Math.random() - .5) * 200, vy: -Math.random() * 220, life: 1 + Math.random(), age: 0 });
      if (stage === 'hold' && holding && Math.random() < .6) sparks.push({ x: g.x + (Math.random() - .5) * 90 * g.s, y: g.y - 135 * g.s, vx: (Math.random() - .5) * 60, vy: -40 - Math.random() * 100, life: .8 + Math.random() * .8, age: 0 });

      /* cake + darkening + flames */
      if (stage !== 'title' && stage !== 'gate') {
        ctx.save(); ctx.beginPath(); ctx.ellipse(g.x, g.y + 20 * g.s, 170 * g.s, 24 * g.s, 0, 0, 6.283);
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill(); ctx.restore();
        drawCake(g);
        if (dim > 0) { ctx.fillStyle = `rgba(0,0,0,${dim * .55})`; ctx.fillRect(0, 0, W, H); }
        const power = stage === 'hold' || stage === 'flash' ? 1 + wish * 1.3 + flash * .5 : 1;
        ctx.globalCompositeOperation = 'lighter'; flames(g, power); ctx.globalCompositeOperation = 'source-over';
        if (stage === 'candles' || stage === 'dim' || stage === 'hold') {   // warm glow on the cake
          const gl = ctx.createRadialGradient(g.x, g.y - 100 * g.s, 0, g.x, g.y - 100 * g.s, 190 * g.s);
          gl.addColorStop(0, `rgba(255,190,100,${.22 + wish * .35})`); gl.addColorStop(1, 'rgba(255,190,100,0)');
          ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
        }
      }

      /* particles */
      ctx.globalCompositeOperation = 'lighter';
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 20 * dt;
        if (p.age > p.life) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255,210,120,${1 - p.age / p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 6.283); ctx.fill();
      }
      for (let i = fw.length - 1; i >= 0; i--) {
        const p = fw[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt; p.vx *= .985;
        if (p.age > p.life) { fw.splice(i, 1); continue; }
        ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i]; p.y += p.vy * dt; p.sw += p.sp * dt; p.x += Math.sin(p.sw) * 30 * dt; p.rot += p.vr * dt;
        if (p.y > H + 20) { confetti.splice(i, 1); continue; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 2));
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }

      /* flash overlay */
      if (flash > 0) {
        const gl = ctx.createRadialGradient(g.x, g.y - 110 * g.s, 0, g.x, g.y - 110 * g.s, Math.max(W, H));
        gl.addColorStop(0, `rgba(255,248,225,${flash})`); gl.addColorStop(1, `rgba(214,170,110,${flash * .85})`);
        ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>

</html>
